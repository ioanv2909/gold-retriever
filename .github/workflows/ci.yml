name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Audit dependencies for known vulnerabilities
        # justetf-scraping is installed from a GitHub zip URL, is not on PyPI and cannot be
        # audited, so it is left out; its own dependencies are still audited. The step fails
        # on known vulnerabilities and only warns when the audit cannot run (network errors).
        run: |
          pip freeze | grep -v '^justetf-scraping' > audit-reqs.txt
          pip install pip-audit
          pip-audit -r audit-reqs.txt --no-deps --disable-pip --progress-spinner off --format json -o audit.json || true
          python - <<'PY'
          import json, sys
          try:
              data = json.load(open("audit.json"))
          except (OSError, ValueError) as e:
              print(f"::warning::pip-audit did not produce a report ({e}); skipping")
              sys.exit(0)
          found = [(d["name"], d["version"], v["id"], ",".join(v.get("fix_versions") or []) or "-")
                   for d in data.get("dependencies", []) for v in d.get("vulns", [])]
          for name, version, vid, fix in found:
              print(f"::error::{name} {version}: {vid} (fixed in {fix})")
          print(f"{len(found)} known vulnerabilities")
          sys.exit(1 if found else 0)
          PY
      - run: python -m compileall -q .
      - name: Check that every import resolves
        run: |
          python - <<'PY'
          import ast, glob, importlib.util, os, sys
          local = {os.path.splitext(os.path.basename(f))[0] for f in glob.glob("*.py") + glob.glob("tools/*.py")}
          optional = {"playwright"}  # only used by tools/screenshots.py
          missing = set()
          for f in glob.glob("*.py") + glob.glob("tools/*.py"):
              tree = ast.parse(open(f, encoding="utf-8").read())
              for n in ast.walk(tree):
                  names = []
                  if isinstance(n, ast.Import):
                      names = [a.name.split(".")[0] for a in n.names]
                  elif isinstance(n, ast.ImportFrom) and n.level == 0 and n.module:
                      names = [n.module.split(".")[0]]
                  for name in names:
                      if name not in local and name not in optional and importlib.util.find_spec(name) is None:
                          missing.add((f, name))
          for f, name in sorted(missing):
              print("unresolved import:", name, "in", f)
          sys.exit(1 if missing else 0)
          PY
      - name: Unit tests
        run: |
          pip install pytest
          python -m pytest -q
