services:
  gold-retriever:
    build: .
    container_name: gold-retriever
    user: "1000:1000"
    environment:
      - HOME=/tmp
      # ora afisata in pagina, in log si in emailuri; alt fus orar: TZ=... in .env
      - TZ=${TZ:-Europe/Bucharest}
      - PYTHONDONTWRITEBYTECODE=1
    # Hardening: read-only image filesystem; the only writable places are data/ (volume) and /tmp
    # (tmpfs: HOME, yfinance cache). No Linux capabilities are needed (uid 1000, port 8501).
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    ports:
      - "${PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
    # logul Docker se roteste (cel mult 3 x 20 MB); logul complet, pe zile, e in data/logs/ (Setari -> Log)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
